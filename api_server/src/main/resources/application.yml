server:
  port: ${SERVER_PORT:8182}

spring:
  application:
    name: banking-api-server
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 자격증명은 저장소에 두지 않는다. 배포 환경의 환경변수로 주입한다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      # 스키마는 schema.sql / db/migration 으로만 관리한다.
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
    database-platform: org.hibernate.dialect.OracleDialect
  jackson:
    default-property-inclusion: non_null

banking:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
    issuer: banking-system
  internal:
    # 스케줄러 서버가 /api/internal/** 호출 시 사용하는 공유 키
    api-key: ${INTERNAL_API_KEY}
  security:
    login:
      # 연속 실패 임계치와 잠금 시간. 잠금은 계정 단위라 악의적 잠금 유발이 가능하니
      # 임계치를 너무 낮게 잡지 않는다.
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
    password-reset:
      ttl: ${PASSWORD_RESET_TTL:30m}
  cors:
    # 비워두면 교차 출처 요청을 전부 차단한다. 예: https://app.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    com.banking_system.api_server: ${LOG_LEVEL:info}
