server:
  port: ${SERVER_PORT:8182}

spring:
  application:
    name: banking-api-server
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 자격증명은 저장소에 두지 않는다. 배포 환경의 환경변수로 주입한다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      # 스키마는 schema.sql / db/migration 으로만 관리한다.
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
    database-platform: org.hibernate.dialect.OracleDialect
  jackson:
    default-property-inclusion: non_null

banking:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
    issuer: banking-system
  internal:
    # 스케줄러 서버가 /api/internal/** 호출 시 사용하는 공유 키
    api-key: ${INTERNAL_API_KEY}

logging:
  level:
    com.banking_system.api_server: ${LOG_LEVEL:info}
