# 로컬 개발용 프로파일: ./gradlew bootRun --args='--spring.profiles.active=local'
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:banking;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

banking:
  jwt:
    secret: local-development-only-secret-key-32bytes+
  internal:
    api-key: local-internal-api-key

logging:
  level:
    com.banking_system.api_server: debug
